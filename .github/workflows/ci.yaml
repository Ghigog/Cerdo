
name: "CI"
on: push

jobs:
  unit_tests_gut:
    name: Run Unit tests (GUT)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.2.2
      GODOT_PARAMS: --headless
      GUT_PARAMS: -gdir=res://Tests/Unit/ -gsuffix=.gd -ginclude_subdirs -gexit
      GODOT_BIN: /usr/local/bin/godot
      GUT_TEMP_FILE: /tmp/gut.log
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Godot 4.2.2
        run: |
          echo "Downloading Godot4"
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 $GODOT_BIN

      - name: Run Unit Tests
        run: |
          # hack to fix issue with failing to import GUTUtils
          # see: https://github.com/bitwes/Gut/issues/589
          $GODOT_BIN -d $GODOT_PARAMS --path $PWD --import

          echo "GUT_PARAMS=$GUT_PARAMS"

          $GODOT_BIN -d $GODOT_PARAMS --path $PWD -s addons/gut/gut_cmdln.gd $GUT_PARAMS 2>&1 | tee $GUT_TEMP_FILE

          # Godot always exists with error 0, but we want this action to fail in case of errors
          if grep -q "No tests ran" "$GUT_TEMP_FILE" || grep -qE "Asserts\s+none" "$GUT_TEMP_FILE";
          then
            echo "No test ran. Please check your 'gut_params'"
            exit 1
          fi

          if  ! grep -q "All tests passed" "$GUT_TEMP_FILE"
          then
            echo "One or more test have failed"
            exit 1
          fi
